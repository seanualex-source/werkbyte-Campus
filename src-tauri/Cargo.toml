[package]
name = "werkbyte-campus"
version = "0.1.0"
description = "werkbyte Campus"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "werkbyte_campus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
campus-core = { path = "campus-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace]
members = ["campus-core"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
