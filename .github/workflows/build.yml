name: Build und Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Kern, IPC und Frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Systempakete für Tauri unter Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Frontend bauen (für IPC-Tests mit echtem Kontext)
        run: npm run build
      - name: Kern- und IPC-Tests (echte SQLite-Dateien, Tauri-Mock-Runtime, Berechtigungen)
        working-directory: src-tauri
        run: cargo test --workspace

  windows:
    name: Windows-Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Nur der Kern: Testprogramme der Tauri-Schicht brauchen unter Windows ein eingebettetes
      # App-Manifest (sonst STATUS_ENTRYPOINT_NOT_FOUND); die IPC-Tests laufen im Linux-Job.
      - name: Kern-Tests unter Windows (Dateisperren, Pfade, NTFS)
        working-directory: src-tauri
        run: cargo test -p campus-core
      - name: Installer bauen (NSIS und MSI, WebView2 offline eingebettet)
        run: npm run app:build
      - name: Prüfsummen erzeugen
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Out-File -Encoding utf8 src-tauri/target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: werkbyte-campus-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
